<header class="site-header">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">
      {{ site.title }}
    </a>

    <nav class="site-nav">
      {% for page in site.header_pages %}
        {% assign my_page = site.pages | where: "path", page | first %}
        {% if my_page.title %}
          <a class="page-link" href="{{ my_page.url | relative_url }}">
            {{ my_page.title }}
          </a>
        {% endif %}
      {% endfor %}

      {% for link in site.nav_external_links %}
        <a class="page-link" href="{{ link.url }}">
          {{ link.title }}
        </a>
      {% endfor %}
    </nav>
  </div>
</header>
